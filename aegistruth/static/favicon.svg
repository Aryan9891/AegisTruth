<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f3ff" />
      <stop offset="50%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
    <linearGradient id="coreGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#00f3ff" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Background Shield Outline -->
  <path d="M32 4 L56 14 C56 38 32 58 32 58 C32 58 8 38 8 14 Z" 
        fill="url(#shieldGrad)" 
        stroke="#00f3ff" 
        stroke-width="2.5" 
        stroke-linejoin="round"
        filter="url(#glow)" />
  <!-- Inner Circuit Grid -->
  <path d="M32 14 L46 22 L46 36 L32 48 L18 36 L18 22 Z" 
        fill="none" 
        stroke="rgba(255,255,255,0.3)" 
        stroke-width="1.5" />
  <!-- Central Truth Emblem (Neural Star/Check) -->
  <circle cx="32" cy="30" r="5" fill="url(#coreGrad)" />
  <path d="M32 17 L32 24 M32 36 L32 43 M21 30 L26 30 M38 30 L43 30" 
        stroke="#00f3ff" 
        stroke-width="2" 
        stroke-linecap="round" />
</svg>

