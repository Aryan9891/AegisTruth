version: '3.8'

services:
  aegistruth-sentinel:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: aegistruth-sentinel
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1
      - PORT=8000
      - HOST=0.0.0.0
    volumes:
      - .:/app
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/report/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

